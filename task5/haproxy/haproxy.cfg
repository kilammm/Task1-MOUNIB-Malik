global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    server server1 server1:80 check
    server server2 server2:80 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
